services:
  # No hay servicio "bot": las alertas van por email, no hay nada
  # interactivo que mantener corriendo. Agregás/sacás productos con
  # `python -m pricewatcher.cli watch|list|unwatch|history` en tu PC,
  # o con `docker compose run --rm price-watcher-checker python -m
  # pricewatcher.cli watch <url>` si preferís no instalar Python local.
  price-watcher-checker:
    build: ./price-watcher
    restart: unless-stopped
    env_file:
      - ./price-watcher/.env
    volumes:
      - ./price-watcher/data:/app/data
    environment:
      - PRICEWATCHER_DB=/app/data/pricewatcher.db
    # Alternativa 100% self-hosted al cron de GitHub Actions: si preferís no
    # depender de que el repo esté en GitHub, este contenedor hace lo mismo
    # localmente, corriendo el chequeo cada 6 horas para siempre.
    entrypoint: ["sh", "-c"]
    command:
      - "while true; do python scripts/run_check.py; sleep 21600; done"

  wall-panel-server:
    build: ./wall-panel/server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./wall-panel/server/.env
    volumes:
      - ./wall-panel/server/data:/app/server/data
    environment:
      - TASKS_PATH=/app/server/data/tasks.json
