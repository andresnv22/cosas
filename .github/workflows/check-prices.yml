name: Chequear precios

on:
  schedule:
    # Cada 6 horas. GitHub a veces retrasa los cron unos minutos en horas
    # pico; para este uso no importa.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # para poder disparlo a mano desde la pestaña Actions

# Mismo grupo que "Seguir producto": nunca corren a la vez, así no se pisan
# al commitear la misma base de datos.
concurrency:
  group: pricewatcher-db
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesita commitear la base de datos actualizada
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        working-directory: price-watcher
        run: pip install -r requirements.txt

      - name: Correr el chequeo
        working-directory: price-watcher
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PRICEWATCHER_DB: data/pricewatcher.db
        run: python scripts/run_check.py

      - name: Guardar el historial actualizado
        run: |
          git config user.name "price-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price-watcher/data/pricewatcher.db
          git diff --staged --quiet || git commit -m "chore: actualizar historial de precios [skip ci]"
          git pull --rebase
          git push
